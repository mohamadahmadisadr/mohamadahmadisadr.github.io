<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site.title | default: 'Mohammad Ahmadi Sadr' }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
  {% seo %}
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="{{ '/' | relative_url }}" class="nav-logo">Mohammad Ahmadi Sadr</a>
      <div class="nav-right">
        <div class="nav-menu">
          <a href="#about" class="nav-link">About</a>
          <a href="#experience" class="nav-link">Experience</a>
          <a href="#skills" class="nav-link">Skills</a>
          <a href="#contact" class="nav-link">Contact</a>
        </div>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
          <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </div>
    </div>
  </nav>

  <main class="main-content">
    {{ content }}
  </main>

  <footer class="footer" id="contact">
    <div class="footer-container">
      <div class="footer-content">
        <div class="footer-info">
          <h3>Let's work together</h3>
          <p>📧 <a href="mailto:mohamadahmadisadr@gmail.com">mohamadahmadisadr@gmail.com</a></p>
          <p>📱 <a href="tel:+14384540470">+1 438-454-0470</a></p>
          <p>📍 Ottawa, Ontario</p>
          <p>🌐 <a href="https://sadr.dev" target="_blank">sadr.dev</a></p>
        </div>
        <div class="social-links">
          <a href="https://github.com/mohamadahmadisadr" target="_blank" class="social-link">GitHub</a>
          <a href="https://linkedin.com/in/mohamadahmadisadr" target="_blank" class="social-link">LinkedIn</a>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; {{ site.time | date: '%Y' }} Mohammad Ahmadi Sadr. All rights reserved.</p>
      </div>
    </div>
  </footer>
  <script src="{{ '/assets/js/main.js?v=' | append: site.github.build_revision | relative_url }}"></script>
</body>
</html>
